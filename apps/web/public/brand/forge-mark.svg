<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="FORGE">
  <title>FORGE</title>
  <!-- An F cut from a sketch profile. Both arms end on the same shear (the extrude
       direction); the dot is the sketch origin left in the negative space.
       32-unit grid, 6-unit stroke. Blue on dark, deep blue on light. -->
  <style>
    .m { fill: #78a8ff; }
    @media (prefers-color-scheme: light) { .m { fill: #285caf; } }
  </style>
  <path class="m" d="M5 4h6v24H5Z"/>
  <path class="m" d="M13 4h14l-3.5 6H13Z"/>
  <path class="m" d="M13 14h10l-3.5 6H13Z"/>
  <circle cx="22" cy="25" r="3" class="m"/>
</svg>
